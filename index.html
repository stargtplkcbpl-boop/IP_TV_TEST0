<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Star TV - Ultimate Pro Admin Edition</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>

        :root {

            --bg: #07090e;

            --surface: rgba(15, 23, 42, 0.75);

            --surface-card: rgba(19, 29, 51, 0.85);

            --primary: #3b82f6;

            --text: #f8fafc;

            --muted: #94a3b8;

            --red: #ef4444;

            --green: #10b981;

            --gold: #f59e0b;

            --border: rgba(255, 255, 255, 0.1);

        }



        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: 'Plus Jakarta Sans', sans-serif;

        }



        body {

            background-color: var(--bg);

            background-image: radial-gradient(circle at 50% -20%, #1e293b, var(--bg));

            color: var(--text);

            min-height: 100vh;

            padding-bottom: 50px;

            background-attachment: fixed;

            background-size: cover;

            background-position: center;

            transition: 0.5s;

        }



        #customerLockScreen {

            position: fixed;

            inset: 0;

            background: rgba(7, 9, 14, 0.95);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            z-index: 99999;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }



        .lock-box {

            background: var(--surface-card);

            width: 100%;

            max-width: 400px;

            padding: 35px 25px;

            border-radius: 20px;

            border: 1px solid var(--border);

            text-align: center;

            box-shadow: 0 20px 40px rgba(0,0,0,0.8);

        }



        .lock-box h2 {

            font-weight: 800;

            margin-bottom: 10px;

            font-size: 24px;

            color: #fff;

        }



        .lock-box p {

            color: var(--muted);

            font-size: 13px;

            margin-bottom: 25px;

        }



        .pin-input {

            width: 100%;

            padding: 15px;

            border-radius: 10px;

            background: rgba(0,0,0,0.5);

            border: 2px solid var(--border);

            color: var(--gold);

            font-size: 24px;

            font-weight: 800;

            text-align: center;

            letter-spacing: 5px;

            margin-bottom: 20px;

            outline: none;

        }



        .pin-input:focus {

            border-color: var(--primary);

            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);

        }



        .lock-err {

            color: var(--red);

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 15px;

            display: none;

        }



        .notice-bar {

            background: linear-gradient(90deg, var(--red), #b91c1c);

            color: white;

            padding: 6px 15px;

            font-size: 13px;

            font-weight: 600;

            display: none;

            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.3);

        }



        .navbar {

            background: rgba(7, 9, 14, 0.7);

            backdrop-filter: blur(20px);

            position: sticky;

            top: 0;

            z-index: 100;

            padding: 15px 24px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid var(--border);

            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);

        }



        .nav-left {

            display: flex;

            align-items: center;

            gap: 18px;

        }



        .menu-icon {

            font-size: 26px;

            cursor: pointer;

            color: var(--text);

            transition: 0.3s;

        }



        .menu-icon:hover {

            color: var(--primary);

            transform: scale(1.1);

        }



        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 20px;

            font-weight: 800;

            cursor: pointer;

            user-select: none;

        }



        .brand span {

            color: var(--primary);

            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);

        }



        .search-box {

            padding: 9px 18px;

            border-radius: 25px;

            border: 1px solid var(--border);

            background: rgba(255,255,255,0.03);

            color: #fff;

            outline: none;

            font-size: 13px;

            width: 100%;

            max-width: 260px;

            transition: 0.3s;

        }



        .search-box:focus {

            border-color: var(--primary);

            background: rgba(255,255,255,0.08);

        }



        .container {

            max-width: 1200px;

            margin: 0 auto;

            padding: 25px 16px;

        }



        .player-box {

            background: #000;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 20px;

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow: 0 15px 35px rgba(0,0,0,0.6);

        }



        .player-wrap {

            width: 100%;

            aspect-ratio: 16/9;

            background: #000;

            position: relative;

        }



        video {

            width: 100%;

            height: 100%;

            object-fit: contain;

        }



        .now-playing {

            background: var(--surface);

            padding: 18px 25px;

            border-top: 1px solid var(--border);

            display: flex;

            justify-content: space-between;

            align-items: center;

            backdrop-filter: blur(10px);

        }



        @keyframes pulse-red {

            0% { opacity: 1; }

            50% { opacity: 0.4; }

            100% { opacity: 1; }

        }



        .live-dot {

            color: var(--red);

            display: inline-block;

            animation: pulse-red 1.5s infinite;

            margin-right: 5px;

        }



        .recent-bar {

            display: flex;

            gap: 10px;

            overflow-x: auto;

            margin-bottom: 20px;

            padding-bottom: 5px;

            scrollbar-width: none;

        }



        .recent-bar::-webkit-scrollbar {

            display: none;

        }



        .recent-chip {

            background: rgba(255,255,255,0.05);

            border: 1px solid var(--border);

            padding: 6px 14px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;

            white-space: nowrap;

            cursor: pointer;

            color: var(--muted);

            transition: 0.2s;

        }



        .recent-chip:hover {

            background: var(--primary);

            color: #fff;

            border-color: var(--primary);

        }



        .category-tabs {

            display: flex;

            gap: 12px;

            overflow-x: auto;

            margin-bottom: 20px;

            padding-bottom: 8px;

            scrollbar-width: none;

        }



        .category-tabs::-webkit-scrollbar {

            display: none;

        }



        .cat-btn {

            background: rgba(255,255,255,0.03);

            border: 1px solid var(--border);

            color: var(--muted);

            padding: 9px 18px;

            border-radius: 25px;

            cursor: pointer;

            white-space: nowrap;

            font-size: 13px;

            font-weight: 700;

            transition: all 0.3s ease;

        }



        .cat-btn.active, .cat-btn:hover {

            background: var(--primary);

            color: white;

            border-color: var(--primary);

            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);

        }



        .grid {

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));

            gap: 20px;

        }



        .card {

            background: var(--surface-card);

            border-radius: 16px;

            overflow: hidden;

            cursor: pointer;

            border: 1px solid var(--border);

            position: relative;

            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

            box-shadow: 0 4px 15px rgba(0,0,0,0.3);

        }



        .card:hover {

            border-color: var(--primary);

            transform: translateY(-6px) scale(1.02);

            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.25);

        }



        .card.premium {

            border: 1px solid var(--gold);

        }



        .banner {

            height: 105px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: linear-gradient(135deg, #1e3a8a, #0f172a);

            overflow: hidden;

            position: relative;

        }



        .banner span {

            font-size: 14px;

            font-weight: 800;

            padding: 0 10px;

            text-transform: uppercase;

            text-align: center;

            z-index: 1;

        }



        .banner img {

            z-index: 1;

            position: relative;

            width: 100%;

            height: 100%;

            object-fit: cover;

        }



        .info {

            padding: 14px 16px;

            position: relative;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }



        .name {

            font-size: 14px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            width: 80%;

        }



        .fav-btn {

            background: none;

            border: none;

            cursor: pointer;

            font-size: 16px;

            color: var(--muted);

            transition: 0.2s;

        }



        .fav-btn.active {

            color: var(--gold);

            text-shadow: 0 0 10px rgba(245, 158, 11, 0.6);

        }



        .vip-badge {

            position: absolute;

            top: 8px;

            left: 8px;

            background: linear-gradient(45deg, #f59e0b, #d97706);

            color: #fff;

            font-size: 10px;

            padding: 4px 8px;

            border-radius: 6px;

            font-weight: 800;

            z-index: 2;

        }



        .offline-badge {

            position: absolute;

            top: 8px;

            right: 8px;

            background: rgba(0,0,0,0.85);

            color: var(--red);

            font-size: 10px;

            padding: 4px 8px;

            border-radius: 6px;

            font-weight: bold;

            border: 1px solid var(--red);

            z-index: 2;

        }



        .card.offline {

            opacity: 0.6;

            pointer-events: none;

            filter: grayscale(90%);

        }



        .admin-overlay {

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.85);

            z-index: 100000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 10px;

            backdrop-filter: blur(10px);

        }



        .admin-panel {

            background: rgba(15, 23, 42, 0.95);

            width: 100%;

            max-width: 700px;

            border-radius: 20px;

            padding: 25px;

            border: 1px solid rgba(255,255,255,0.15);

            max-height: 90vh;

            overflow-y: auto;

            box-shadow: 0 25px 50px rgba(0,0,0,0.7);

        }



        .admin-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            border-bottom: 1px solid var(--border);

            padding-bottom: 15px;

        }



        .close-btn {

            cursor: pointer;

            font-size: 24px;

            color: var(--red);

            font-weight: bold;

            transition: 0.3s;

        }



        .close-btn:hover {

            transform: rotate(90deg);

        }



        .stats-box {

            display: flex;

            gap: 12px;

            margin-bottom: 20px;

            flex-wrap: wrap;

        }



        .stat {

            flex: 1;

            min-width: 100px;

            background: rgba(255,255,255,0.03);

            padding: 15px;

            border-radius: 12px;

            text-align: center;

            border: 1px solid var(--border);

        }



        .stat span {

            font-size: 22px;

            font-weight: 800;

            color: var(--primary);

            display: block;

            margin-bottom: 4px;

        }



        .stat div {

            font-size: 11px;

            color: var(--muted);

            text-transform: uppercase;

            font-weight: 600;

        }



        .admin-section {

            background: rgba(0,0,0,0.2);

            padding: 20px;

            border-radius: 14px;

            margin-bottom: 20px;

            border: 1px solid var(--border);

        }



        .admin-input {

            width: 100%;

            padding: 14px;

            margin-bottom: 12px;

            background: rgba(0,0,0,0.5);

            border: 1px solid var(--border);

            border-radius: 10px;

            color: #fff;

            outline: none;

            font-size: 13px;

        }



        .admin-input:focus {

            border-color: var(--primary);

        }



        .admin-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: var(--primary);

            color: #fff;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;

        }



        .admin-btn:hover {

            filter: brightness(1.2);

            transform: translateY(-2px);

        }



        .admin-btn.danger {

            background: var(--red);

        }



        .admin-btn.success {

            background: var(--green);

        }



        .admin-btn.gold {

            background: var(--gold);

            color: #000;

        }



        .admin-btn.secondary {

            background: rgba(255,255,255,0.1);

        }



        .admin-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

        }



        .admin-label {

            font-size: 11px;

            color: var(--muted);

            font-weight: 700;

            margin-bottom: 6px;

            display: block;

        }



        .admin-list {

            max-height: 250px;

            overflow-y: auto;

            margin-top: 15px;

        }



        .admin-list-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px;

            border-bottom: 1px solid var(--border);

            gap: 10px;

        }



        .admin-list-item:last-child {

            border-bottom: none;

        }



        .admin-list-item small {

            color: var(--muted);

            font-size: 10px;

            display: block;

            margin-top: 3px;

        }



        .admin-list-item button {

            padding: 6px 10px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 10px;

            font-weight: 700;

            color: #fff;

            background: var(--red);

        }



        .admin-list-item button.edit {

            background: var(--primary);

        }



        .toast {

            position: fixed;

            bottom: 25px;

            left: 50%;

            transform: translateX(-50%) translateY(100px);

            background: #1e293b;

            color: white;

            padding: 14px 25px;

            border-radius: 10px;

            font-size: 13px;

            font-weight: 600;

            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

            z-index: 200000;

            transition: 0.4s;

            border: 1px solid var(--border);

            text-align: center;

            max-width: 90%;

        }



        .toast.show {

            transform: translateX(-50%) translateY(0);

        }



        .empty {

            text-align: center;

            padding: 50px 20px;

            color: var(--muted);

            font-size: 14px;

            grid-column: 1 / -1;

        }



        .side-menu {

            position: fixed;

            top: 0;

            left: -300px;

            width: 280px;

            height: 100%;

            background: rgba(15, 23, 42, 0.98);

            z-index: 100001;

            transition: 0.4s;

            padding: 30px 20px;

            border-right: 1px solid var(--border);

            box-shadow: 10px 0 30px rgba(0,0,0,0.5);

        }



        .side-menu.open {

            left: 0;

        }



        .side-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }



        .side-link {

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 14px;

            border-radius: 10px;

            cursor: pointer;

            margin-bottom: 8px;

            color: var(--muted);

            font-weight: 600;

            transition: 0.2s;

        }



        .side-link:hover {

            background: rgba(255,255,255,0.05);

            color: #fff;

        }



        .side-link.active {

            background: var(--primary);

            color: #fff;

        }



        .overlay-bg {

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.6);

            z-index: 100000;

            display: none;

        }



        .overlay-bg.show {

            display: block;

        }



        .modal {

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.85);

            z-index: 100002;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 15px;

            backdrop-filter: blur(10px);

        }



        .modal.show {

            display: flex;

        }



        .modal-box {

            background: #0f172a;

            width: 100%;

            max-width: 500px;

            border-radius: 18px;

            padding: 25px;

            border: 1px solid var(--border);

            max-height: 90vh;

            overflow-y: auto;

        }



        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }



        .modal-title {

            font-size: 18px;

            font-weight: 800;

        }



        .channel-detail {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

        }



        .channel-logo {

            width: 70px;

            height: 70px;

            border-radius: 12px;

            object-fit: cover;

            background: #1e293b;

        }



        .channel-meta h3 {

            font-size: 18px;

            margin-bottom: 5px;

        }



        .channel-meta p {

            color: var(--muted);

            font-size: 12px;

        }



        .detail-actions {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

        }



        .footer {

            text-align: center;

            padding: 30px 20px;

            color: var(--muted);

            font-size: 11px;

            border-top: 1px solid var(--border);

            margin-top: 30px;

        }



        .footer span {

            color: var(--primary);

            font-weight: 700;

        }



        @media (max-width: 600px) {

            .navbar {

                padding: 12px 15px;

            }



            .brand {

                font-size: 16px;

            }



            .search-box {

                max-width: 140px;

            }



            .grid {

                grid-template-columns: repeat(2, 1fr);

                gap: 12px;

            }



            .banner {

                height: 85px;

            }



            .info {

                padding: 10px;

            }



            .name {

                font-size: 12px;

            }



            .admin-row {

                grid-template-columns: 1fr;

            }



            .detail-actions {

                grid-template-columns: 1fr;

            }

        }

    </style>
