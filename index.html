<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star TV - Live Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1a1a1a; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.7); }
        h2, h3 { text-align: center; color: #ff3b30; }
        .section { background: #262626; padding: 15px; margin: 15px 0; border-radius: 8px; }
        input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        input, select { background: #333; color: #fff; }
        button { background: #e50914; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #b20710; }
        #syncStatus { text-align: center; font-size: 14px; margin-bottom: 15px; color: #00e676; font-weight: bold; }
        .channel-list { margin-top: 10px; max-height: 200px; overflow-y: auto; }
        .channel-item { background: #333; padding: 8px 12px; margin: 5px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Star TV Control Panel</h2>
        <div id="syncStatus">Connecting to Cloud Sync...</div>

        <!-- PIN Management Section -->
        <div class="section">
            <h3>Security PIN Management</h3>
            <input type="password" id="masterPin" placeholder="Enter Access PIN">
            <button onclick="updatePin()">Save / Update PIN</button>
        </div>

        <!-- Channel Management Section -->
        <div class="section">
            <h3>Channel Management</h3>
            <input type="text" id="channelName" placeholder="Channel Name">
            <input type="text" id="channelUrl" placeholder="Stream URL / Link">
            <button onclick="addChannel()">Add Channel to Cloud</button>
            
            <div class="channel-list" id="channelContainer">
                <!-- Channels will load here dynamically from Firebase -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your Firebase Configuration (Linked to Star TV Project)
        const firebaseConfig = {
          apiKey: "AIzaSyBO6CylWZx5aMdafKQ8c6Pl-V7vAz9o4GY",
          authDomain: "star-tv-d029f.firebaseapp.com",
          databaseURL: "https://star-tv-d029f-default-rtdb.firebaseio.com/",
          projectId: "star-tv-d029f",
          storageBucket: "star-tv-d029f.firebasestorage.app",
          messagingSenderId: "928025188965",
          appId: "1:928025188965:web:954974944c478fdeab848c"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Connection Status Tracker
        const statusEl = document.getElementById("syncStatus");
        onValue(ref(db, '.info/connected'), (snap) => {
            if (snap.val() === true) {
                statusEl.innerText = "Cloud Sync Active (Connected)";
                statusEl.style.color = "#00e676";
            } else {
                statusEl.innerText = "Offline - Waiting for connection...";
                statusEl.style.color = "#ff9800";
            }
        });

        // 1. Update PIN Function
        window.updatePin = function() {
            const pin = document.getElementById("masterPin").value;
            if (!pin) {
                alert("Please enter a valid PIN!");
                return;
            }
            set(ref(db, 'settings/masterPin'), pin)
                .then(() => alert("PIN updated successfully across all devices!"))
                .catch((err) => alert("Error: " + err.message));
        };

        // 2. Add Channel Function
        window.addChannel = function() {
            const name = document.getElementById("channelName").value;
            const url = document.getElementById("channelUrl").value;
            if (!name || !url) {
                alert("Please fill in both channel name and URL!");
                return;
            }

            const channelsRef = ref(db, 'channels');
            push(channelsRef, { name, url })
                .then(() => {
                    document.getElementById("channelName").value = "";
                    document.getElementById("channelUrl").value = "";
                    alert("Channel added to cloud successfully!");
                })
                .catch((err) => alert("Error adding channel: " + err.message));
        };

        // 3. Real-time Channel Sync Across Devices
        const channelContainer = document.getElementById("channelContainer");
        onValue(ref(db, 'channels'), (snapshot) => {
            channelContainer.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach((key) => {
                    const channel = data[key];
                    const div = document.createElement("div");
                    div.className = "channel-item";
                    div.innerHTML = `<span><strong>${channel.name}</strong></span> <span style="font-size:12px; color:#aaa;">Synced</span>`;
                    channelContainer.appendChild(div);
                });
            } else {
                channelContainer.innerHTML = "<p style='color:#777; text-align:center;'>No channels found in cloud.</p>";
            }
        });
    </script>
</body>
</html>
